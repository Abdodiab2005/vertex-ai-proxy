# For a server whose own nginx already owns ports 80/443 and terminates TLS for other sites.
# Run from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.host-proxy.yml up -d --build
#
# The bundled nginx is left out (it would need 80/443), and the API and the admin panel are published
# on loopback ports only; the host nginx proxies the two domains to them (deploy/nginx/host/). The
# host nginx reaches the containers through the Docker network gateway, which TRUST_PROXY already
# covers, so the API still sees the client address the host nginx forwards.

services:
  nginx:
    # Only started with --profile bundled-proxy.
    profiles: ["bundled-proxy"]

  api:
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3830}:3000"

  admin:
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-3831}:3001"
