# One hostname. Replace gemini.example.com.
#
# /            admin panel
# /v1beta      Gemini API
# /health      liveness, readiness, and the combined health check
# /admin       refused. The panel calls the API on the Docker network through
#              its /admin-api forwarder; this vhost must not publish /admin.

# Log format uses $uri instead of $request/$request_uri to prevent query parameter
# credentials (?key=...) from being written to persistent access logs.
log_format gateway '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time '
                   '"$upstream_http_x_request_id"';

server {
    listen 80;
    server_name gemini.example.com;
    server_tokens off;
    access_log /var/log/nginx/access.log gateway;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gemini.example.com;
    server_tokens off;
    access_log /var/log/nginx/access.log gateway;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:gateway_ssl:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location /admin/ {
        return 404;
    }

    location = /admin {
        return 404;
    }

    location /v1beta/ {
        include /etc/nginx/gateway/proxy-api.inc;
    }

    location = /v1beta {
        include /etc/nginx/gateway/proxy-api.inc;
    }

    location /health/ {
        include /etc/nginx/gateway/proxy-api.inc;
    }

    location = /health {
        include /etc/nginx/gateway/proxy-api.inc;
    }

    location / {
        include /etc/nginx/gateway/proxy-admin.inc;
    }
}
