packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@parcel/watcher': true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.6 || 12.1.0'
  - '@nestjs/core@11.2.6 || 12.1.0'
  - '@nestjs/platform-express@11.2.6 || 12.1.0'
  - '@nestjs/testing@11.2.6 || 12.1.0'
  - ts-jest@29.4.13
